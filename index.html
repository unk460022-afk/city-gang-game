<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Zone FINAL</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#18231b;
 font-family:Arial,sans-serif;
 touch-action:none;
}
#game{
 position:relative;
 width:100vw;
 height:100vh;
 overflow:hidden;
 background:
 repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 70px),
 repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 70px),
 #286239;
}

/* CITY */
.roadH{
 position:absolute;
 left:0;
 top:44%;
 width:100%;
 height:155px;
 background:#555;
 border-top:5px solid #777;
 border-bottom:5px solid #777;
}
.roadH:after{
 content:"";
 position:absolute;
 left:0;
 top:73px;
 width:100%;
 border-top:6px dashed #eee;
}

.roadV{
 position:absolute;
 top:0;
 left:43%;
 width:125px;
 height:100%;
 background:#555;
 border-left:5px solid #777;
 border-right:5px solid #777;
}
.roadV:after{
 content:"";
 position:absolute;
 top:0;
 left:57px;
 height:100%;
 border-left:6px dashed #eee;
}

.building{
 position:absolute;
 width:145px;
 height:190px;
 background:#414141;
 border:8px solid #777;
 z-index:2;
}
.win{
 display:inline-block;
 width:22px;
 height:25px;
 background:#8fc9f5;
 margin:9px 7px;
}

/* PLAYER */
#player{
 position:absolute;
 width:58px;
 height:58px;
 border-radius:50%;
 background:#1599ed;
 border:3px solid #0b6ea9;
 transform:translate(-50%,-50%);
 z-index:20;
}
#player:after{
 content:"";
 position:absolute;
 width:10px;
 height:32px;
 background:#111;
 left:21px;
 top:-25px;
 border-radius:3px;
}

/* HUD */
#hud{
 position:absolute;
 top:12px;
 left:12px;
 z-index:100;
 background:rgba(0,0,0,.84);
 color:white;
 padding:10px 14px;
 border-radius:17px;
 font-size:17px;
 line-height:1.55;
 min-width:180px;
}
#mission{
 position:absolute;
 top:12px;
 right:12px;
 z-index:100;
 background:rgba(0,0,0,.84);
 color:white;
 padding:12px 15px;
 border-radius:17px;
 text-align:center;
 font-size:17px;
}
#message{
 display:none;
 position:absolute;
 top:125px;
 left:50%;
 transform:translateX(-50%);
 z-index:150;
 background:#111;
 color:#ffd83d;
 padding:9px 17px;
 border-radius:20px;
 font-weight:bold;
}

/* ENEMY */
.enemy{
 position:absolute;
 width:48px;
 height:48px;
 border-radius:50%;
 background:#a32bc6;
 border:3px solid #71138c;
 z-index:15;
}
.enemy:before{
 content:"";
 position:absolute;
 width:46px;
 height:6px;
 top:-13px;
 left:0;
 background:#27e85b;
 border-radius:5px;
}
.enemyShot{
 position:absolute;
 width:9px;
 height:15px;
 background:#ff3b30;
 border-radius:5px;
 z-index:18;
}

/* BULLET */
.bullet{
 position:absolute;
 width:8px;
 height:17px;
 background:#ffe52c;
 border-radius:5px;
 z-index:30;
}

/* HEALTH */
.health{
 position:absolute;
 width:42px;
 height:42px;
 background:white;
 border:4px solid #ddd;
 color:red;
 font-size:31px;
 text-align:center;
 line-height:34px;
 z-index:10;
}

/* CONTROLS */
#movement{
 position:absolute;
 left:18px;
 bottom:18px;
 width:190px;
 height:190px;
 z-index:90;
}
.btn{
 position:absolute;
 width:62px;
 height:62px;
 border-radius:50%;
 border:2px solid rgba(255,255,255,.55);
 background:rgba(60,60,60,.65);
 color:white;
 font-size:25px;
}
.up{left:64px;top:0}
.left{left:0;top:64px}
.right{right:0;top:64px}
.down{left:64px;bottom:0}

#actions{
 position:absolute;
 right:15px;
 bottom:18px;
 width:220px;
 height:190px;
 z-index:90;
}
.action{
 position:absolute;
 border:2px solid rgba(255,255,255,.55);
 background:rgba(50,50,50,.72);
 color:white;
 font-weight:bold;
}
.fire{
 right:0;
 bottom:0;
 width:105px;
 height:105px;
 border-radius:50%;
 background:#d8322e;
 font-size:22px;
}
.reload{
 left:0;
 top:0;
 width:95px;
 height:55px;
 border-radius:30px;
}
.weapon{
 left:0;
 top:67px;
 width:95px;
 height:55px;
 border-radius:30px;
}
.car{
 right:0;
 top:0;
 width:95px;
 height:55px;
 border-radius:30px;
}

/* GAME OVER */
#gameOver{
 display:none;
 position:absolute;
 inset:0;
 z-index:500;
 background:rgba(0,0,0,.9);
 color:white;
 text-align:center;
 padding-top:30vh;
}
#gameOver h1{
 color:#ff4038;
 font-size:40px;
 margin:10px;
}
#restart{
 padding:14px 28px;
 border:0;
 border-radius:12px;
 font-size:19px;
 font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<div class="roadH"></div>
<div class="roadV"></div>

<!-- BUILDINGS -->
<div class="building" style="left:2%;top:8%">
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
</div>

<div class="building" style="right:2%;top:10%">
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
</div>

<div class="building" style="left:2%;bottom:8%">
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
</div>

<div class="building" style="right:2%;bottom:8%">
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
<span class="win"></span><span class="win"></span><span class="win"></span>
</div>

<div id="player"></div>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
⭐ Score: <span id="score">0</span><br>
💀 Kills: <span id="kills">0</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔫 Weapon: <span id="weaponName">RIFLE</span>
</div>

<div id="mission">
🎯 MISSION <span id="missionNo">1</span><br>
Defeat <span id="target">10</span> enemies
</div>

<div id="message"></div>

<!-- MOVEMENT -->
<div id="movement">
<button class="btn up" id="up">▲</button>
<button class="btn left" id="left">◀</button>
<button class="btn right" id="right">▶</button>
<button class="btn down" id="down">▼</button>
</div>

<!-- ACTIONS -->
<div id="actions">
<button class="action reload" id="reload">RELOAD</button>
<button class="action weapon" id="weapon">🔫 WEAPON</button>
<button class="action car" id="car">🚗 CAR</button>
<button class="action fire" id="fire">FIRE</button>
</div>

<div id="gameOver">
<h1>GAME OVER</h1>
<p id="final"></p>
<button id="restart">🔄 RESTART</button>
</div>

</div>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");

let px=innerWidth/2;
let py=innerHeight*.55;

let hp=100;
let ammo=30;
let score=0;
let kills=0;
let coins=0;

let mission=1;
let target=10;

let weapon="RIFLE";
let carMode=false;
let gameEnded=false;

let keys={
 up:false,
 down:false,
 left:false,
 right:false
};

let enemies=[];
let bullets=[];
let enemyBullets=[];

function update(){

 document.getElementById("hp").textContent=Math.max(0,Math.floor(hp));
 document.getElementById("ammo").textContent=ammo;
 document.getElementById("score").textContent=score;
 document.getElementById("kills").textContent=kills;
 document.getElementById("coins").textContent=coins;
 document.getElementById("weaponName").textContent=weapon;
 document.getElementById("missionNo").textContent=mission;
 document.getElementById("target").textContent=target;
}

function message(t){

 const m=document.getElementById("message");
 m.textContent=t;
 m.style.display="block";

 setTimeout(()=>{
  m.style.display="none";
 },1300);
}

function movePlayer(){

 if(gameEnded)return;

 let speed=carMode?7:4;

 if(keys.up)py-=speed;
 if(keys.down)py+=speed;
 if(keys.left)px-=speed;
 if(keys.right)px+=speed;

 px=Math.max(30,Math.min(innerWidth-30,px));
 py=Math.max(80,Math.min(innerHeight-80,py));

 player.style.left=px+"px";
 player.style.top=py+"px";

 requestAnimationFrame(movePlayer);
}

movePlayer();

function control(id,direction){

 const b=document.getElementById(id);

 b.addEventListener("touchstart",e=>{
  e.preventDefault();
  keys[direction]=true;
 });

 b.addEventListener("touchend",e=>{
  e.preventDefault();
  keys[direction]=false;
 });

 b.addEventListener("mousedown",()=>{
  keys[direction]=true;
 });

 b.addEventListener("mouseup",()=>{
  keys[direction]=false;
 });

 b.addEventListener("mouseleave",()=>{
  keys[direction]=false;
 });
}

control("up","up");
control("down","down");
control("left","left");
control("right","right");

/* ENEMIES */

function spawnEnemy(){

 if(gameEnded)return;

 const e=document.createElement("div");
 e.className="enemy";

 let x=Math.random()*(innerWidth-70)+35;
 let y=Math.random()*(innerHeight-230)+100;

 e.style.left=x+"px";
 e.style.top=y+"px";

 game.appendChild(e);

 enemies.push({
  el:e,
  x:x,
  y:y,
  hp:2,
  speed:.6+Math.random()*.6,
  shotTimer:0
 });
}

for(let i=0;i<6;i++)spawnEnemy();

setInterval(()=>{

 if(!gameEnded && enemies.length<9){
  spawnEnemy();
 }

},1800);

/* ENEMY AI */

setInterval(()=>{

 if(gameEnded)return;

 enemies.forEach(e=>{

  let dx=px-e.x;
  let dy=py-e.y;
  let d=Math.hypot(dx,dy);

  if(d>65){

   e.x+=(dx/d)*e.speed;
   e.y+=(dy/d)*e.speed;

  }else{

   hp-=1;

   if(hp<=0){
    gameOver();
   }

  }

  e.shotTimer++;

  if(e.shotTimer>100 && d<450){

   enemyShoot(e);
   e.shotTimer=0;
  }

  e.el.style.left=e.x+"px";
  e.el.style.top=e.y+"px";

 });

 update();

},30);

/* PLAYER SHOOT */

function shoot(){

 if(gameEnded)return;

 if(ammo<=0){
  message("❌ NO AMMO");
  return;
 }

 ammo--;

 let damage=1;

 if(weapon==="SHOTGUN")damage=2;
 if(weapon==="PISTOL")damage=1;

 const b=document.createElement("div");
 b.className="bullet";

 let bx=px-4;
 let by=py-35;

 b.style.left=bx+"px";
 b.style.top=by+"px";

 game.appendChild(b);

 bullets.push({
  el:b,
  x:bx,
  y:by,
  damage:damage
 });

 update();
}

document.getElementById("fire").onclick=shoot;

/* BULLET ENGINE */

setInterval(()=>{

 bullets.forEach((b,bi)=>{

  b.y-=13;

  b.el.style.left=b.x+"px";
  b.el.style.top=b.y+"px";

  enemies.forEach((e,ei)=>{

   if(Math.hypot(b.x-e.x,b.y-e.y)<35){

    e.hp-=b.damage;

    b.el.remove();
    bullets.splice(bi,1);

    if(e.hp<=0){

     e.el.remove();
     enemies.splice(ei,1);

     kills++;
     score+=100;
     coins+=10;

     if(kills%target===0){

      mission++;
      target+=5;

      hp=Math.min(100,hp+20);
      ammo+=15;

      message("🎯 MISSION COMPLETE!");

     }

     update();
    }

   }

  });

  if(b.y<0){

   b.el.remove();
   bullets.splice(bi,1);
  }

 });

},35);

/* ENEMY SHOOT */

function enemyShoot(e){

 const b=document.createElement("div");
 b.className="enemyShot";

 let x=e.x;
 let y=e.y;

 game.appendChild(b);

 enemyBullets.push({
  el:b,
  x:x,
  y:y,
  dx:px-x,
  dy:py-y
 });

 let obj=enemyBullets[enemyBullets.length-1];

 let d=Math.hypot(obj.dx,obj.dy);

 obj.dx/=d;
 obj.dy/=d;
}

/* ENEMY BULLETS */

setInterval(()=>{

 enemyBullets.forEach((b,i)=>{

  b.x+=b.dx*6;
  b.y+=b.dy*6;

  b.el.style.left=b.x+"px";
  b.el.style.top=b.y+"px";

  if(Math.hypot(b.x-px,b.y-py)<35){

   hp-=8;

   b.el.remove();
   enemyBullets.splice(i,1);

   if(hp<=0)gameOver();

   update();
  }

  if(b.x<0||b.x>innerWidth||b.y<0||b.y>innerHeight){

   b.el.remove();
   enemyBullets.splice(i,1);
  }

 });

},40);

/* RELOAD */

document.getElementById("reload").onclick=()=>{

 if(gameEnded)return;

 ammo=30;

 message("🔄 RELOADED");

 update();
};

/* WEAPON */

document.getElementById("weapon").onclick=()=>{

 if(weapon==="RIFLE"){
  weapon="SHOTGUN";
 }else if(weapon==="SHOTGUN"){
  weapon="PISTOL";
 }else{
  weapon="RIFLE";
 }

 message("🔫 "+weapon);

 update();
};

/* CAR */

document.getElementById("car").onclick=()=>{

 carMode=!carMode;

 message(carMode?"🚗 CAR MODE ON":"🚶 CAR MODE OFF");
};

/* HEALTH */

function spawnHealth(){

 const h=document.createElement("div");
 h.className="health";
 h.textContent="✚";

 let x=Math.random()*(innerWidth-70)+35;
 let y=Math.random()*(innerHeight-300)+130;

 h.style.left=x+"px";
 h.style.top=y+"px";

 game.appendChild(h);

 const timer=setInterval(()=>{

  if(gameEnded){
   clearInterval(timer);
   return;
  }

  if(Math.hypot(px-x,py-y)<55){

   hp=Math.min(100,hp+30);

   h.remove();
   clearInterval(timer);

   message("❤️ HEALTH +30");

   update();
  }

 },150);
}

spawnHealth();

setInterval(()=>{

 if(!gameEnded && document.querySelectorAll(".health").length<2){
  spawnHealth();
 }

},6000);

/* GAME OVER */

function gameOver(){

 if(gameEnded)return;

 gameEnded=true;

 document.getElementById("gameOver").style.display="block";

 document.getElementById("final").textContent=
 "⭐ Score: "+score+
 "   |   💀 Kills: "+kills+
 "   |   🪙 Coins: "+coins;
}

document.getElementById("restart").onclick=()=>{
 location.reload();
};

update();

</script>

</body>
</html>
