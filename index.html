 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Zone V3</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;overflow:hidden;background:#18251b;font-family:Arial}
canvas{width:100vw;height:100vh;display:block}
#hud{
position:fixed;top:10px;left:10px;z-index:5;color:white;
background:#000b;padding:10px 14px;border-radius:14px;
font-size:16px;line-height:1.55
}
#mission{
position:fixed;top:10px;right:10px;z-index:5;color:white;
background:#000b;padding:10px;border-radius:14px;text-align:center
}
.btn{
position:fixed;z-index:10;border:2px solid #ffffff66;
background:#ffffff30;color:white;border-radius:50%;
width:64px;height:64px;font-size:27px;font-weight:bold
}
#up{left:82px;bottom:155px}
#left{left:15px;bottom:85px}
#right{left:149px;bottom:85px}
#down{left:82px;bottom:15px}
#fire{right:18px;bottom:35px;width:105px;height:105px;background:#d83232bb;font-size:20px}
#reload{right:135px;bottom:50px;width:70px;height:50px;font-size:13px}
#weapon{right:135px;bottom:115px;width:70px;height:50px;font-size:12px}
#mini{
position:fixed;right:12px;top:105px;width:120px;height:120px;
background:#0009;border:2px solid white;border-radius:10px;z-index:6
}
#start,#over{
position:fixed;inset:0;z-index:20;background:#000d;color:white;
display:flex;align-items:center;justify-content:center;
flex-direction:column;text-align:center
}
#over{display:none}
h1{font-size:40px;margin:10px}
.big{
padding:15px 30px;border:0;border-radius:15px;
background:#e53935;color:white;font-size:20px;font-weight:bold
}
</style>
</head>
<body>

<canvas id="game"></canvas>
<canvas id="mini"></canvas>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
⭐ Score: <span id="score">0</span><br>
💀 Kills: <span id="kills">0</span><br>
🪙 Coins: <span id="coins">0</span>
</div>

<div id="mission">🎯 MISSION<br>Defeat 15 enemies</div>

<div id="start">
<h1>⚔️ BATTLE ZONE V3</h1>
<p>Mobile Action Battle</p>
<button class="big" onclick="start()">START GAME</button>
</div>

<div id="over">
<h1 id="result">GAME OVER</h1>
<p id="final"></p>
<button class="big" onclick="location.reload()">PLAY AGAIN</button>
</div>

<button class="btn" id="up">▲</button>
<button class="btn" id="left">◀</button>
<button class="btn" id="right">▶</button>
<button class="btn" id="down">▼</button>
<button class="btn" id="weapon">RIFLE</button>
<button class="btn" id="reload">RELOAD</button>
<button class="btn" id="fire">FIRE</button>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const m=document.getElementById("mini"),mx=m.getContext("2d");
let W,H;

function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}
resize();addEventListener("resize",resize);

const world=3000;
let playing=false,score=0,kills=0,coins=0;
let bullets=[],enemies=[],buildings=[],kits=[],cars=[];
let keys={};
let camera={x:0,y:0};

let p={
 x:1500,y:1500,r:19,hp:100,ammo:30,
 speed:4,weapon:"RIFLE",cool:0
};

function start(){
 document.getElementById("start").style.display="none";
 makeWorld();
 for(let i=0;i<10;i++)spawnEnemy();
 playing=true;
 requestAnimationFrame(loop);
}

function makeWorld(){
 buildings=[];kits=[];cars=[];

 for(let i=0;i<38;i++){
  let b={
   x:Math.random()*2700+100,
   y:Math.random()*2700+100,
   w:90+Math.random()*120,
   h:80+Math.random()*130
  };
  if(Math.hypot(b.x-1500,b.y-1500)>300)buildings.push(b);
 }

 for(let i=0;i<15;i++)
  kits.push({x:200+Math.random()*2600,y:200+Math.random()*2600});

 for(let i=0;i<6;i++)
  cars.push({
   x:300+Math.random()*2400,
   y:300+Math.random()*2400,
   a:Math.random()*6.28
  });
}

function hitRect(x,y,r,b){
 let xx=Math.max(b.x,Math.min(x,b.x+b.w));
 let yy=Math.max(b.y,Math.min(y,b.y+b.h));
 return Math.hypot(x-xx,y-yy)<r;
}

function blocked(x,y,r){
 if(x<r||y<r||x>world-r||y>world-r)return true;
 return buildings.some(b=>hitRect(x,y,r,b));
}

function spawnEnemy(){
 let x,y;
 do{
  x=100+Math.random()*2800;
  y=100+Math.random()*2800;
 }while(Math.hypot(x-p.x,y-p.y)<450||blocked(x,y,20));

 enemies.push({
  x,y,r:18,hp:60,speed:1.1+Math.random()*.5,
  shoot:Math.random()*80
 });
}

function move(dx,dy){
 let nx=p.x+dx,ny=p.y+dy;
 if(!blocked(nx,p.y,p.r))p.x=nx;
 if(!blocked(p.x,ny,p.r))p.y=ny;
}

function fire(){
 if(!playing||p.cool>0)return;

 if(p.ammo<=0){
  alert("Ammo empty! Reload.");
  return;
 }

 p.ammo--;
 p.cool=p.weapon=="RIFLE"?7:18;

 let best=null,bd=600;

 for(let e of enemies){
  let d=Math.hypot(e.x-p.x,e.y-p.y);
  if(d<bd){bd=d;best=e}
 }

 let ang=best?Math.atan2(best.y-p.y,best.x-p.x):0;

 bullets.push({
  x:p.x,y:p.y,
  vx:Math.cos(ang)*12,
  vy:Math.sin(ang)*12,
  life:60,
  damage:p.weapon=="RIFLE"?30:50
 });
}

function reload(){
 if(!playing)return;
 p.ammo=30;
}

function weapon(){
 p.weapon=p.weapon=="RIFLE"?"PISTOL":"RIFLE";
 document.getElementById("weapon").textContent=p.weapon;
}

function update(){
 if(!playing)return;

 p.cool=Math.max(0,p.cool-1);

 let dx=0,dy=0;
 if(keys.up)dy--;
 if(keys.down)dy++;
 if(keys.left)dx--;
 if(keys.right)dx++;

 if(dx||dy){
  let l=Math.hypot(dx,dy);
  move(dx/l*p.speed,dy/l*p.speed);
 }

 camera.x=Math.max(0,Math.min(world-W,p.x-W/2));
 camera.y=Math.max(0,Math.min(world-H,p.y-H/2));

 for(let b of bullets){
  b.x+=b.vx;b.y+=b.vy;b.life--;

  for(let e of enemies){
   if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+6){
    e.hp-=b.damage;
    b.life=0;

    if(e.hp<=0){
     kills++;
     score+=100;
     coins+=10;
    }
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0);

 for(let e of enemies){
  if(e.hp<=0)continue;

  let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);

  if(d>55){
   let nx=e.x+dx/d*e.speed;
   let ny=e.y+dy/d*e.speed;

   if(!blocked(nx,e.y,e.r))e.x=nx;
   if(!blocked(e.x,ny,e.r))e.y=ny;
  }else{
   e.shoot--;
   if(e.shoot<=0){
    p.hp-=6;
    e.shoot=45;
   }
  }
 }

 enemies=enemies.filter(e=>e.hp>0);

 if(Math.random()<.015&&enemies.length<14)spawnEnemy();

 for(let k of kits){
  if(!k.used&&Math.hypot(k.x-p.x,k.y-p.y)<35){
   k.used=true;
   p.hp=Math.min(100,p.hp+25);
  }
 }
 kits=kits.filter(k=>!k.used);

 if(kills>=15)finish(true);
 if(p.hp<=0)finish(false);

 document.getElementById("hp").textContent=Math.max(0,Math.floor(p.hp));
 document.getElementById("ammo").textContent=p.ammo;
 document.getElementById("score").textContent=score;
 document.getElementById("kills").textContent=kills;
 document.getElementById("coins").textContent=coins;
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 ctx.fillStyle="#285b35";
 ctx.fillRect(0,0,world,world);

 // roads
 ctx.fillStyle="#555";
 ctx.fillRect(0,1420,world,150);
 ctx.fillRect(1420,0,150,world);

 // grid
 ctx.strokeStyle="#ffffff12";
 for(let x=0;x<world;x+=80){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world);ctx.stroke();
 }
 for(let y=0;y<world;y+=80){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world,y);ctx.stroke();
 }

 // buildings
 for(let b of buildings){
  ctx.fillStyle="#555b62";
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle="#33383d";
  ctx.fillRect(b.x+8,b.y+8,b.w-16,b.h-16);

  ctx.fillStyle="#8fd0ff";
  for(let x=b.x+18;x<b.x+b.w-15;x+=30)
   for(let y=b.y+18;y<b.y+b.h-15;y+=30)
    ctx.fillRect(x,y,11,11);
 }

 // cars
 for(let car of cars){
  ctx.save();
  ctx.translate(car.x,car.y);
  ctx.rotate(car.a);
  ctx.fillStyle="#c8c8c8";
  ctx.fillRect(-35,-16,70,32);
  ctx.fillStyle="#222";
  ctx.fillRect(-18,-11,30,22);
  ctx.restore();
 }

 // health kits
 for(let k of kits){
  ctx.fillStyle="#eee";
  ctx.fillRect(k.x-12,k.y-12,24,24);
  ctx.fillStyle="#e33";
  ctx.fillRect(k.x-4,k.y-9,8,18);
  ctx.fillRect(k.x-9,k.y-4,18,8);
 }

 // bullets
 for(let b of bullets){
  ctx.fillStyle="#ffd43b";
  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();
 }

 // enemies
 for(let e of enemies){
  ctx.fillStyle="#a52ab8";
  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#222";
  ctx.fillRect(e.x-22,e.y-30,44,6);
  ctx.fillStyle="#32e85b";
  ctx.fillRect(e.x-22,e.y-30,44*(e.hp/60),6);
 }

 // player
 ctx.fillStyle="#2196f3";
 ctx.beginPath();
 ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";
 ctx.fillRect(p.x-4,p.y-32,8,17);

 ctx.restore();

 drawMini();
}

function drawMini(){
 mx.clearRect(0,0,120,120);
 mx.fillStyle="#1f4c2b";
 mx.fillRect(0,0,120,120);

 let sx=120/world,sy=120/world;

 mx.fillStyle="#b44";
 for(let b of buildings)
  mx.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);

 mx.fillStyle="#b52ab8";
 for(let e of enemies)
  mx.fillRect(e.x*sx-2,e.y*sy-2,4,4);

 mx.fillStyle="#2af";
 mx.beginPath();
 mx.arc(p.x*sx,p.y*sy,4,0,Math.PI*2);
 mx.fill();
}

function finish(win){
 playing=false;
 document.getElementById("over").style.display="flex";
 document.getElementById("result").textContent=win?"🏆 VICTORY!":"💀 GAME OVER";
 document.getElementById("final").textContent=
 "Score: "+score+" | Kills: "+kills+" | Coins: "+coins;
}

function bind(id,key){
 let e=document.getElementById(id);

 e.addEventListener("touchstart",x=>{
  x.preventDefault();keys[key]=true;
 },{passive:false});

 e.addEventListener("touchend",x=>{
  x.preventDefault();keys[key]=false;
 },{passive:false});

 e.addEventListener("mousedown",()=>keys[key]=true);
 e.addEventListener("mouseup",()=>keys[key]=false);
}

bind("up","up");
bind("down","down");
bind("left","left");
bind("right","right");

document.getElementById("fire").onclick=fire;
document.getElementById("reload").onclick=reload;
document.getElementById("weapon").onclick=weapon;

addEventListener("keydown",e=>{
 if(e.key=="ArrowUp"||e.key=="w")keys.up=true;
 if(e.key=="ArrowDown"||e.key=="s")keys.down=true;
 if(e.key=="ArrowLeft"||e.key=="a")keys.left=true;
 if(e.key=="ArrowRight"||e.key=="d")keys.right=true;
 if(e.code=="Space")fire();
 if(e.key=="r")reload();
});

addEventListener("keyup",e=>{
 if(e.key=="ArrowUp"||e.key=="w")keys.up=false;
 if(e.key=="ArrowDown"||e.key=="s")keys.down=false;
 if(e.key=="ArrowLeft"||e.key=="a")keys.left=false;
 if(e.key=="ArrowRight"||e.key=="d")keys.right=false;
});

function loop(){
 update();
 draw();
 if(playing)requestAnimationFrame(loop);
}
</script>
</body>
</html>
