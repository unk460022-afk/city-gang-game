<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Zone</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

body{
  margin:0;
  overflow:hidden;
  background:#101820;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  background:#315b35;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:5;
  padding:10px 14px;
  border-radius:12px;
  background:#000b;
  color:white;
  font-size:16px;
  line-height:1.7;
}

#message{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:#000c;
  font-size:32px;
  font-weight:bold;
}

#message button{
  margin-top:20px;
  padding:14px 25px;
  border:0;
  border-radius:12px;
  background:#28a745;
  color:white;
  font-size:18px;
}

.control{
  position:fixed;
  z-index:10;
  width:62px;
  height:62px;
  border:2px solid #ffffff55;
  border-radius:50%;
  background:#ffffff35;
  color:white;
  font-size:25px;
  font-weight:bold;
}

#up{left:82px;bottom:142px}
#left{left:12px;bottom:72px}
#right{left:152px;bottom:72px}
#down{left:82px;bottom:5px}

#fire{
  right:20px;
  bottom:48px;
  width:85px;
  height:85px;
  background:#d62828cc;
  font-size:17px;
}

#reload{
  right:125px;
  bottom:145px;
  width:60px;
  height:60px;
  background:#333b;
  font-size:13px;
}
</style>
</head>

<body>

<div id="hud">
  ❤️ HP: <span id="hp">100</span><br>
  🔫 Ammo: <span id="ammo">20</span><br>
  ⭐ Score: <span id="score">0</span><br>
  👾 Enemies: <span id="enemyCount">0</span>
</div>

<canvas id="game"></canvas>

<button class="control" id="up">▲</button>
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
<button class="control" id="down">▼</button>
<button class="control" id="reload">RELOAD</button>
<button class="control" id="fire">FIRE</button>

<div id="message">
  GAME OVER<br>
  <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  if(!started){
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    zone.x = canvas.width / 2;
    zone.y = canvas.height / 2;
    zone.r = Math.min(canvas.width,canvas.height) * 0.45;
  }
}

let started = false;

const player = {
  x:0,
  y:0,
  r:18,
  speed:4,
  hp:100
};

const zone = {
  x:0,
  y:0,
  r:200
};

let bullets = [];
let enemies = [];
let score = 0;
let ammo = 20;
let gameOver = false;

const keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

resize();
window.addEventListener("resize",resize);

function updateHUD(){
  document.getElementById("hp").textContent =
    Math.max(0,Math.floor(player.hp));

  document.getElementById("ammo").textContent = ammo;
  document.getElementById("score").textContent = score;
  document.getElementById("enemyCount").textContent = enemies.length;
}

function createEnemy(){
  if(gameOver) return;

  const side = Math.floor(Math.random()*4);
  let x,y;

  if(side===0){
    x=Math.random()*canvas.width;
    y=-30;
  }else if(side===1){
    x=canvas.width+30;
    y=Math.random()*canvas.height;
  }else if(side===2){
    x=Math.random()*canvas.width;
    y=canvas.height+30;
  }else{
    x=-30;
    y=Math.random()*canvas.height;
  }

  enemies.push({
    x:x,
    y:y,
    r:17,
    hp:30,
    speed:1+Math.random()*0.8
  });
}

setInterval(createEnemy,1100);

function shoot(){
  if(gameOver || ammo<=0) return;

  ammo--;

  let target=null;
  let shortest=Infinity;

  for(const enemy of enemies){
    const d=Math.hypot(
      enemy.x-player.x,
      enemy.y-player.y
    );

    if(d<shortest){
      shortest=d;
      target=enemy;
    }
  }

  let dx=0;
  let dy=-1;

  if(target){
    dx=target.x-player.x;
    dy=target.y-player.y;

    const length=Math.hypot(dx,dy);
    dx/=length;
    dy/=length;
  }

  bullets.push({
    x:player.x,
    y:player.y,
    dx:dx,
    dy:dy,
    speed:11,
    life:70
  });

  updateHUD();
}

function reload(){
  if(!gameOver){
    ammo=20;
    updateHUD();
  }
}

function movePlayer(){
  if(keys.up) player.y-=player.speed;
  if(keys.down) player.y+=player.speed;
  if(keys.left) player.x-=player.speed;
  if(keys.right) player.x+=player.speed;

  player.x=Math.max(player.r,
    Math.min(canvas.width-player.r,player.x));

  player.y=Math.max(player.r,
    Math.min(canvas.height-player.r,player.y));
}

function updateBullets(){
  for(const bullet of bullets){
    bullet.x+=bullet.dx*bullet.speed;
    bullet.y+=bullet.dy*bullet.speed;
    bullet.life--;
  }

  bullets=bullets.filter(b =>
    b.life>0 &&
    b.x>-50 &&
    b.x<canvas.width+50 &&
    b.y>-50 &&
    b.y<canvas.height+50
  );
}

function updateEnemies(){
  for(const enemy of enemies){
    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;
    const distance=Math.hypot(dx,dy);

    if(distance>1){
      enemy.x+=(dx/distance)*enemy.speed;
      enemy.y+=(dy/distance)*enemy.speed;
    }

    if(distance<player.r+enemy.r){
      player.hp-=0.35;
    }
  }
}

function bulletCollisions(){
  for(let b=bullets.length-1;b>=0;b--){
    const bullet=bullets[b];

    for(let e=enemies.length-1;e>=0;e--){
      const enemy=enemies[e];

      const distance=Math.hypot(
        bullet.x-enemy.x,
        bullet.y-enemy.y
      );

      if(distance<enemy.r+6){
        enemy.hp-=30;
        bullets.splice(b,1);

        if(enemy.hp<=0){
          enemies.splice(e,1);
          score+=10;
        }

        break;
      }
    }
  }
}

function updateZone(){
  zone.r-=0.012;

  if(zone.r<100){
    zone.r=100;
  }

  const distance=Math.hypot(
    player.x-zone.x,
    player.y-zone.y
  );

  if(distance>zone.r){
    player.hp-=0.08;
  }
}

function drawBackground(){
  ctx.fillStyle="#315b35";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#ffffff12";
  ctx.lineWidth=1;

  for(let x=0;x<canvas.width;x+=50){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  }

  for(let y=0;y<canvas.height;y+=50){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }
}

function drawZone(){
  ctx.beginPath();
  ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);
  ctx.strokeStyle="#55d9ff";
  ctx.lineWidth=4;
  ctx.stroke();
}

function drawEnemies(){
  for(const enemy of enemies){
    ctx.beginPath();
    ctx.arc(enemy.x,enemy.y,enemy.r,0,Math.PI*2);
    ctx.fillStyle="#e63946";
    ctx.fill();

    ctx.fillStyle="#111";
    ctx.fillRect(enemy.x-17,enemy.y-enemy.r-10,34,5);

    ctx.fillStyle="#4ade80";
    ctx.fillRect(
      enemy.x-17,
      enemy.y-enemy.r-10,
      34*(enemy.hp/30),
      5
    );
  }
}

function drawBullets(){
  for(const bullet of bullets){
    ctx.beginPath();
    ctx.arc(bullet.x,bullet.y,5,0,Math.PI*2);
    ctx.fillStyle="#ffe066";
    ctx.fill();
  }
}

function drawPlayer(){
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle="#2196f3";
  ctx.fill();

  ctx.strokeStyle="#17202a";
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.lineTo(player.x,player.y-30);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r+4,0,Math.PI*2);
  ctx.strokeStyle="#ffffff66";
  ctx.lineWidth=2;
  ctx.stroke();
}

function drawWarning(){
  const distance=Math.hypot(
    player.x-zone.x,
    player.y-zone.y
  );

  if(distance>zone.r){
    ctx.fillStyle="#ff4444";
    ctx.font="bold 18px Arial";
    ctx.fillText(
      "⚠ OUTSIDE SAFE ZONE!",
      20,
      canvas.height-20
    );
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawBackground();
  drawZone();
  drawEnemies();
  drawBullets();
  drawPlayer();
  drawWarning();
}

function endGame(){
  gameOver=true;
  document.getElementById("message").style.display="flex";
}

function gameLoop(){
  if(gameOver) return;

  movePlayer();
  updateBullets();
  updateEnemies();
  bulletCollisions();
  updateZone();
  updateHUD();
  draw();

  if(player.hp<=0){
    endGame();
    return;
  }

  requestAnimationFrame(gameLoop);
}

function bindControl(id,key){
  const button=document.getElementById(id);

  button.addEventListener("touchstart",function(event){
    event.preventDefault();
    keys[key]=true;
  },{passive:false});

  button.addEventListener("touchend",function(event){
    event.preventDefault();
    keys[key]=false;
  },{passive:false});

  button.addEventListener("touchcancel",function(){
    keys[key]=false;
  });

  button.addEventListener("mousedown",function(){
    keys[key]=true;
  });

  button.addEventListener("mouseup",function(){
    keys[key]=false;
  });

  button.addEventListener("mouseleave",function(){
    keys[key]=false;
  });
}

bindControl("up","up");
bindControl("down","down");
bindControl("left","left");
bindControl("right","right");

document.getElementById("fire").addEventListener("click",shoot);
document.getElementById("reload").addEventListener("click",reload);

started=true;
updateHUD();
gameLoop();
</script>

</body>
</html>
