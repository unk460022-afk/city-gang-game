<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>City Gang</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
    touch-action:none;
}
canvas{
    display:block;
    background:#444;
}
#ui{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    font-size:18px;
    z-index:5;
    text-shadow:2px 2px #000;
}
#fire{
    position:fixed;
    right:25px;
    bottom:35px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:3px solid white;
    background:#c62828;
    color:white;
    font-size:18px;
}
#up,#down,#left,#right{
    position:fixed;
    width:55px;
    height:55px;
    border-radius:15px;
    border:2px solid white;
    background:#222b;
    color:white;
    font-size:25px;
}
#up{left:75px;bottom:145px}
#down{left:75px;bottom:25px}
#left{left:15px;bottom:85px}
#right{left:135px;bottom:85px}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
❤️ Health: <span id="health">100</span><br>
💰 Money: ₹<span id="money">0</span><br>
🎯 Mission: Defeat <span id="kills">0</span>/10
</div>

<button id="up">▲</button>
<button id="down">▼</button>
<button id="left">◀</button>
<button id="right">▶</button>
<button id="fire">FIRE</button>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player={
    x:canvas.width/2,
    y:canvas.height/2,
    speed:4,
    health:100
};

let money=0;
let kills=0;

let keys={};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function hold(button,key){

    button.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    button.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });
}

hold(document.getElementById("up"),"w");
hold(document.getElementById("down"),"s");
hold(document.getElementById("left"),"a");
hold(document.getElementById("right"),"d");

let enemies=[];

function spawnEnemy(){

    enemies.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        health:50,
        speed:1
    });
}

for(let i=0;i<10;i++){
    spawnEnemy();
}

let bullets=[];

function shoot(){

    if(enemies.length===0)return;

    let target=null;
    let distance=9999;

    for(let enemy of enemies){

        let dx=enemy.x-player.x;
        let dy=enemy.y-player.y;

        let d=Math.sqrt(dx*dx+dy*dy);

        if(d<distance){
            distance=d;
            target=enemy;
        }
    }

    if(target){

        let dx=target.x-player.x;
        let dy=target.y-player.y;
        let d=Math.sqrt(dx*dx+dy*dy);

        bullets.push({
            x:player.x,
            y:player.y,
            vx:dx/d*9,
            vy:dy/d*9
        });
    }
}

let firing=false;

const fireButton=document.getElementById("fire");

fireButton.addEventListener("touchstart",e=>{
    e.preventDefault();
    firing=true;
});

fireButton.addEventListener("touchend",e=>{
    e.preventDefault();
    firing=false;
});

fireButton.addEventListener("mousedown",()=>{
    firing=true;
});

fireButton.addEventListener("mouseup",()=>{
    firing=false;
});

let lastShot=0;

function update(){

    if(keys["w"]||keys["arrowup"])
        player.y-=player.speed;

    if(keys["s"]||keys["arrowdown"])
        player.y+=player.speed;

    if(keys["a"]||keys["arrowleft"])
        player.x-=player.speed;

    if(keys["d"]||keys["arrowright"])
        player.x+=player.speed;

    player.x=Math.max(20,Math.min(canvas.width-20,player.x));
    player.y=Math.max(20,Math.min(canvas.height-20,player.y));

    if(firing && Date.now()-lastShot>300){
        shoot();
        lastShot=Date.now();
    }

    for(let b of bullets){
        b.x+=b.vx;
        b.y+=b.vy;
    }

    for(let enemy of enemies){

        let dx=player.x-enemy.x;
        let dy=player.y-enemy.y;
        let d=Math.sqrt(dx*dx+dy*dy);

        if(d>25){

            enemy.x+=dx/d*enemy.speed;
            enemy.y+=dy/d*enemy.speed;

        }else{

            player.health-=0.15;

        }
    }

    for(let i=enemies.length-1;i>=0;i--){

        for(let j=bullets.length-1;j>=0;j--){

            let dx=enemies[i].x-bullets[j].x;
            let dy=enemies[i].y-bullets[j].y;

            if(Math.sqrt(dx*dx+dy*dy)<20){

                enemies[i].health-=25;
                bullets.splice(j,1);

                if(enemies[i].health<=0){

                    enemies.splice(i,1);

                    kills++;
                    money+=100;

                    spawnEnemy();

                    break;
                }
            }
        }
    }

    document.getElementById("health").textContent=
        Math.max(0,Math.floor(player.health));

    document.getElementById("money").textContent=money;

    document.getElementById("kills").textContent=
        Math.min(kills,10);

    if(player.health<=0){

        alert("GAME OVER");

        location.reload();
    }

    if(kills>=10){

        alert("MISSION COMPLETE! You earned ₹1000");

        money+=1000;
        kills=0;
    }
}

function drawCity(){

    ctx.fillStyle="#555";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Roads

    ctx.fillStyle="#333";

    ctx.fillRect(0,canvas.height/2-70,
                 canvas.width,140);

    ctx.fillRect(canvas.width/2-70,0,
                 140,canvas.height);

    // Buildings

    ctx.fillStyle="#777";

    for(let x=20;x<canvas.width;x+=150){

        for(let y=20;y<canvas.height;y+=150){

            if(
                Math.abs(x-canvas.width/2)>100 &&
                Math.abs(y-canvas.height/2)>100
            ){

                ctx.fillRect(x,y,100,90);

            }
        }
    }
}

function draw(){

    drawCity();

    // Bullets

    ctx.fillStyle="yellow";

    for(let b of bullets){

        ctx.beginPath();
        ctx.arc(b.x,b.y,5,0,Math.PI*2);
        ctx.fill();
    }

    // Enemies

    for(let enemy of enemies){

        ctx.fillStyle="red";

        ctx.beginPath();
        ctx.arc(enemy.x,enemy.y,18,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="black";
        ctx.fillRect(enemy.x-15,enemy.y-27,30,4);

        ctx.fillStyle="lime";
        ctx.fillRect(
            enemy.x-15,
            enemy.y-27,
            30*(enemy.health/50),
            4
        );
    }

    // Player

    ctx.fillStyle="blue";

    ctx.beginPath();
    ctx.arc(player.x,player.y,20,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    ctx.fillText("YOU",player.x,player.y+4);
}

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
</body>
</html>
