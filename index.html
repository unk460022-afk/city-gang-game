<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>City Gang Game</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}
canvas{
    display:block;
    background:#292929;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    color:white;
    font-size:18px;
    line-height:1.55;
    text-shadow:2px 2px #000;
    z-index:5;
}

#message{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    background:#000b;
    padding:8px 15px;
    border-radius:10px;
    display:none;
    z-index:10;
}

.controls{
    position:fixed;
    bottom:25px;
    left:20px;
    width:310px;
    height:190px;
    z-index:10;
}

.btn{
    position:absolute;
    width:70px;
    height:65px;
    border:2px solid white;
    border-radius:18px;
    background:#222b;
    color:white;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.up{left:105px;top:0}
.left{left:0;top:70px}
.right{left:210px;top:70px}
.down{left:105px;top:70px}

#fire{
    position:fixed;
    right:30px;
    bottom:55px;
    width:115px;
    height:115px;
    border-radius:50%;
    border:4px solid white;
    background:#c22;
    color:white;
    font-size:20px;
    z-index:10;
}

#restart{
    position:fixed;
    display:none;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:15px 25px;
    font-size:20px;
    border:0;
    border-radius:12px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
❤️ Health: <span id="health">100</span><br>
💰 Money: ₹<span id="money">0</span><br>
🎯 Mission: <span id="mission">0</span>/10<br>
🔫 Weapon: <span id="weapon">Pistol</span><br>
⭐ Score: <span id="score">0</span>
</div>

<div id="message"></div>

<div class="controls">
    <div class="btn up" id="up">▲</div>
    <div class="btn left" id="left">◀</div>
    <div class="btn down" id="down">▼</div>
    <div class="btn right" id="right">▶</div>
</div>

<button id="fire">FIRE</button>
<button id="restart">RESTART GAME</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let player = {
    x: canvas.width/2,
    y: canvas.height/2,
    size:22,
    speed:4,
    health:100,
    money:0,
    score:0
};

let enemies=[];
let bullets=[];
let npcs=[];
let keys={};

let mission=0;
let gameOver=false;
let weapon="Pistol";

const healthText=document.getElementById("health");
const moneyText=document.getElementById("money");
const missionText=document.getElementById("mission");
const scoreText=document.getElementById("score");
const weaponText=document.getElementById("weapon");
const message=document.getElementById("message");

/* ---------------- CONTROLS ---------------- */

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
        shoot();
    }

    if(e.key.toLowerCase()==="e"){
        interact();
    }

    if(e.key.toLowerCase()==="q"){
        changeWeapon();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

/* Mobile buttons */

function holdButton(id,key){
    const b=document.getElementById(id);

    b.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    b.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });
}

holdButton("up","w");
holdButton("down","s");
holdButton("left","a");
holdButton("right","d");

document.getElementById("fire").addEventListener("touchstart",e=>{
    e.preventDefault();
    shoot();
});

document.getElementById("fire").addEventListener("click",shoot);

/* ---------------- CITY ---------------- */

function drawCity(){

    ctx.fillStyle="#303030";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* Roads */

    ctx.fillStyle="#222";
    ctx.fillRect(canvas.width/2-110,0,220,canvas.height);
    ctx.fillRect(0,canvas.height/2-110,canvas.width,220);

    /* Buildings */

    ctx.fillStyle="#555";

    for(let x=0;x<canvas.width;x+=250){
        for(let y=0;y<canvas.height;y+=220){

            if(
                x>canvas.width/2-150 &&
                x<canvas.width/2+150
            ) continue;

            if(
                y>canvas.height/2-150 &&
                y<canvas.height/2+150
            ) continue;

            ctx.fillRect(x+15,y+15,190,160);
        }
    }

    /* Road lines */

    ctx.strokeStyle="#777";
    ctx.setLineDash([25,20]);
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(canvas.width/2,0);
    ctx.lineTo(canvas.width/2,canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,canvas.height/2);
    ctx.lineTo(canvas.width,canvas.height/2);
    ctx.stroke();

    ctx.setLineDash([]);
}

/* ---------------- PLAYER ---------------- */

function drawPlayer(){

    ctx.beginPath();
    ctx.fillStyle="blue";
    ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    ctx.fillText("YOU",player.x,player.y+4);
}

/* ---------------- ENEMIES ---------------- */

function spawnEnemy(){

    let side=Math.floor(Math.random()*4);
    let x,y;

    if(side===0){
        x=Math.random()*canvas.width;
        y=30;
    }
    else if(side===1){
        x=canvas.width-30;
        y=Math.random()*canvas.height;
    }
    else if(side===2){
        x=Math.random()*canvas.width;
        y=canvas.height-30;
    }
    else{
        x=30;
        y=Math.random()*canvas.height;
    }

    enemies.push({
        x:x,
        y:y,
        size:22,
        health:50,
        speed:1+Math.random()*0.6
    });
}

function drawEnemy(e){

    ctx.beginPath();
    ctx.fillStyle="red";
    ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
    ctx.fill();

    /* health bar */

    ctx.fillStyle="lime";
    ctx.fillRect(
        e.x-25,
        e.y-32,
        Math.max(0,e.health)/2,
        5
    );
}

/* ---------------- FEMALE NPCs ---------------- */

function spawnNPC(){

    npcs.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:18,
        name:"Girl"
    });
}

function drawNPC(n){

    /* head */

    ctx.beginPath();
    ctx.fillStyle="#f2b28d";
    ctx.arc(n.x,n.y-18,9,0,Math.PI*2);
    ctx.fill();

    /* hair */

    ctx.beginPath();
    ctx.fillStyle="#3b2115";
    ctx.arc(n.x,n.y-21,10,Math.PI,Math.PI*2);
    ctx.fill();

    /* body */

    ctx.fillStyle="#e85aa0";
    ctx.fillRect(n.x-10,n.y-8,20,28);

    ctx.fillStyle="white";
    ctx.font="11px Arial";
    ctx.textAlign="center";
    ctx.fillText(n.name,n.x,n.y+42);
}

/* ---------------- SHOOTING ---------------- */

function shoot(){

    if(gameOver)return;

    let nearest=null;
    let dist=Infinity;

    enemies.forEach(e=>{
        let d=Math.hypot(e.x-player.x,e.y-player.y);

        if(d<dist){
            dist=d;
            nearest=e;
        }
    });

    if(!nearest)return;

    let angle=Math.atan2(
        nearest.y-player.y,
        nearest.x-player.x
    );

    bullets.push({
        x:player.x,
        y:player.y,
        dx:Math.cos(angle)*9,
        dy:Math.sin(angle)*9,
        damage:25
    });
}

/* ---------------- BULLETS ---------------- */

function updateBullets(){

    bullets.forEach(b=>{
        b.x+=b.dx;
        b.y+=b.dy;
    });

    bullets=bullets.filter(b=>
        b.x>0 &&
        b.x<canvas.width &&
        b.y>0 &&
        b.y<canvas.height
    );
}

function drawBullets(){

    bullets.forEach(b=>{
        ctx.beginPath();
        ctx.fillStyle="yellow";
        ctx.arc(b.x,b.y,5,0,Math.PI*2);
        ctx.fill();
    });
}

/* ---------------- COLLISION ---------------- */

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function updateEnemies(){

    enemies.forEach(e=>{

        let angle=Math.atan2(
            player.y-e.y,
            player.x-e.x
        );

        e.x+=Math.cos(angle)*e.speed;
        e.y+=Math.sin(angle)*e.speed;

        if(distance(e,player)<40){

            player.health-=0.25;

            if(player.health<=0){
                endGame();
            }
        }
    });

    bullets.forEach(b=>{

        enemies.forEach(e=>{

            if(distance(b,e)<25){

                e.health-=b.damage;
                b.x=-999;

                if(e.health<=0){

                    player.money+=100;
                    player.score+=10;
                    mission++;

                    showMessage("Enemy defeated! +₹100");

                }
            }
        });
    });

    enemies=enemies.filter(e=>e.health>0);

    while(enemies.length<6 && !gameOver){
        spawnEnemy();
    }
}

/* ---------------- MOVEMENT ---------------- */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(keys["w"] || keys["arrowup"])dy--;
    if(keys["s"] || keys["arrowdown"])dy++;
    if(keys["a"] || keys["arrowleft"])dx--;
    if(keys["d"] || keys["arrowright"])dx++;

    if(dx!==0 || dy!==0){

        let len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;
    }

    player.x=Math.max(25,
        Math.min(canvas.width-25,player.x));

    player.y=Math.max(25,
        Math.min(canvas.height-25,player.y));
}

/* ---------------- NPC INTERACTION ---------------- */

function interact(){

    npcs.forEach(n=>{

        if(distance(player,n)<70){

            player.money+=50;
            showMessage("NPC helped you! +₹50");
        }
    });
}

/* ---------------- WEAPON ---------------- */

function changeWeapon(){

    if(weapon==="Pistol"){
        weapon="Shotgun";
    }
    else if(weapon==="Shotgun"){
        weapon="SMG";
    }
    else{
        weapon="Pistol";
    }

    weaponText.textContent=weapon;
    showMessage("Weapon changed: "+weapon);
}

/* ---------------- MESSAGE ---------------- */

function showMessage(text){

    message.textContent=text;
    message.style.display="block";

    setTimeout(()=>{
        message.style.display="none";
    },1500);
}

/* ---------------- GAME OVER ---------------- */

function endGame(){

    gameOver=true;
    showMessage("GAME OVER");

    document.getElementById("restart").style.display="block";
}

document.getElementById("restart").onclick=()=>{

    player.health=100;
    player.money=0;
    player.score=0;

    mission=0;
    enemies=[];
    bullets=[];

    gameOver=false;

    document.getElementById("restart").style.display="none";

    for(let i=0;i<6;i++){
        spawnEnemy();
    }
};

/* ---------------- HUD ---------------- */

function updateHUD(){

    healthText.textContent=Math.max(0,
        Math.floor(player.health));

    moneyText.textContent=player.money;

    missionText.textContent=Math.min(
        mission,10);

    scoreText.textContent=player.score;
}

/* ---------------- GAME LOOP ---------------- */

function gameLoop(){

    drawCity();

    if(!gameOver){

        updatePlayer();
        updateBullets();
        updateEnemies();

        npcs.forEach(drawNPC);
        enemies.forEach(drawEnemy);

        drawBullets();
        drawPlayer();

        updateHUD();

        if(mission>=10){

            showMessage("🏆 MISSION COMPLETE!");

            mission=0;
            player.money+=1000;
        }
    }
    else{

        enemies.forEach(drawEnemy);
        npcs.forEach(drawNPC);
        drawPlayer();
    }

    requestAnimationFrame(gameLoop);
}

/* Initial NPCs */

for(let i=0;i<5;i++){
    spawnNPC();
}

/* Initial enemies */

for(let i=0;i<6;i++){
    spawnEnemy();
}

gameLoop();

</script>

</body>
</html>
