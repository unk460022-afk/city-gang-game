<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Zone V5</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
 user-select:none;
}
html,body{
 margin:0;
 overflow:hidden;
 background:#182b1d;
 font-family:Arial,sans-serif;
 touch-action:none;
}
canvas{display:block}

#hud{
 position:fixed;
 top:12px;
 left:12px;
 z-index:5;
 color:white;
 background:rgba(0,0,0,.78);
 padding:10px 14px;
 border-radius:15px;
 font-size:17px;
 line-height:1.5;
}

#mission{
 position:fixed;
 top:12px;
 right:12px;
 z-index:5;
 color:white;
 background:rgba(0,0,0,.78);
 padding:10px 14px;
 border-radius:15px;
 text-align:center;
 font-size:16px;
}

#notice{
 position:fixed;
 top:100px;
 left:50%;
 transform:translateX(-50%);
 z-index:6;
 color:white;
 background:rgba(0,0,0,.7);
 padding:8px 16px;
 border-radius:20px;
 display:none;
}

.controls{
 position:fixed;
 left:0;
 right:0;
 bottom:12px;
 height:190px;
 z-index:10;
}

.btn{
 position:absolute;
 border:2px solid rgba(255,255,255,.55);
 background:rgba(255,255,255,.22);
 color:white;
 border-radius:50%;
 display:flex;
 justify-content:center;
 align-items:center;
 font-weight:bold;
 touch-action:none;
}

.move{
 width:70px;
 height:70px;
 font-size:27px;
}

#up{left:78px;bottom:112px}
#left{left:12px;bottom:42px}
#right{left:144px;bottom:42px}
#down{left:78px;bottom:0}

.action{
 width:72px;
 height:58px;
 border-radius:18px;
 font-size:13px;
}

#weapon{
 right:230px;
 bottom:118px;
}

#reload{
 right:145px;
 bottom:118px;
}

#car{
 right:60px;
 bottom:118px;
}

#fire{
 right:18px;
 bottom:5px;
 width:105px;
 height:105px;
 border-radius:50%;
 background:rgba(210,45,40,.88);
 font-size:19px;
}

#gameOver{
 position:fixed;
 inset:0;
 z-index:30;
 display:none;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 color:white;
 background:rgba(0,0,0,.9);
 text-align:center;
}

#gameOver h1{font-size:38px}

#restart{
 padding:14px 28px;
 border:0;
 border-radius:12px;
 font-size:19px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
⭐ Score: <span id="score">0</span><br>
💀 Kills: <span id="kills">0</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔫 Weapon: <span id="weaponText">RIFLE</span>
</div>

<div id="mission">
🎯 MISSION 1<br>
Defeat <b id="missionTarget">10</b> enemies
</div>

<div id="notice"></div>

<div class="controls">

<button class="btn move" id="up">▲</button>
<button class="btn move" id="left">◀</button>
<button class="btn move" id="right">▶</button>
<button class="btn move" id="down">▼</button>

<button class="btn action" id="weapon">WEAPON</button>
<button class="btn action" id="reload">RELOAD</button>
<button class="btn action" id="car">🚗 CAR</button>

<button class="btn" id="fire">FIRE</button>

</div>

<div id="gameOver">
<h1 id="endTitle">GAME OVER</h1>
<h2>Score: <span id="endScore">0</span></h2>
<p>Coins: <span id="endCoins">0</span></p>
<button id="restart">PLAY AGAIN</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const WORLD=3600;

let player={
 x:1800,
 y:1800,
 r:21,
 hp:100,
 angle:0,
 speed:3
};

let camera={x:0,y:0};

let ammo=30;
let score=0;
let kills=0;
let coins=0;

let weapon="RIFLE";
let inCar=false;
let running=true;

let enemies=[];
let bullets=[];
let enemyBullets=[];
let buildings=[];
let cars=[];
let pickups=[];

let mission=1;
let missionTargets=[10,25,45];
let missionTarget=10;

/* ---------------- BUILDINGS ---------------- */

for(let x=100;x<WORLD-100;x+=520){
 for(let y=100;y<WORLD-100;y+=520){

  if(Math.random()<.82){

   buildings.push({
    x:x+100+Math.random()*40,
    y:y+100+Math.random()*40,
    w:260+Math.random()*100,
    h:230+Math.random()*100
   });

  }
 }
}

/* ---------------- CARS ---------------- */

for(let i=0;i<18;i++){

 cars.push({
  x:200+Math.random()*(WORLD-400),
  y:200+Math.random()*(WORLD-400),
  w:92,
  h:46,
  angle:Math.random()*Math.PI*2,
  color:i%3===0?"#e53935":i%3===1?"#2475d8":"#e0a21a"
 });

}

/* ---------------- PICKUPS ---------------- */

for(let i=0;i<30;i++){

 pickups.push({
  x:100+Math.random()*(WORLD-200),
  y:100+Math.random()*(WORLD-200),
  type:Math.random()<.65?"coin":"health"
 });

}

/* ---------------- ENEMIES ---------------- */

function spawnEnemy(){

 let e={
  x:100+Math.random()*(WORLD-200),
  y:100+Math.random()*(WORLD-200),
  r:21,
  hp:100,
  speed:.65+Math.random()*.5,
  police:Math.random()<.4,
  shoot:0
 };

 enemies.push(e);
}

for(let i=0;i<12;i++)spawnEnemy();

/* ---------------- CONTROLS ---------------- */

let keys={
 up:false,
 down:false,
 left:false,
 right:false
};

function holdButton(id,key){

 let b=document.getElementById(id);

 b.addEventListener("touchstart",function(e){
  e.preventDefault();
  keys[key]=true;
 },{passive:false});

 b.addEventListener("touchend",function(e){
  e.preventDefault();
  keys[key]=false;
 },{passive:false});

 b.addEventListener("touchcancel",function(){
  keys[key]=false;
 });

 b.addEventListener("mousedown",function(){
  keys[key]=true;
 });

 b.addEventListener("mouseup",function(){
  keys[key]=false;
 });

 b.addEventListener("mouseleave",function(){
  keys[key]=false;
 });
}

holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");

/* ---------------- FIRE ---------------- */

function fire(){

 if(!running)return;

 if(ammo<=0){
  showNotice("NO AMMO! RELOAD");
  return;
 }

 ammo--;

 let damage=weapon==="RIFLE"?50:32;
 let speed=weapon==="RIFLE"?12:9;

 bullets.push({
  x:player.x+Math.cos(player.angle)*30,
  y:player.y+Math.sin(player.angle)*30,
  vx:Math.cos(player.angle)*speed,
  vy:Math.sin(player.angle)*speed,
  life:80,
  damage:damage
 });

}

document.getElementById("fire").addEventListener(
 "touchstart",
 e=>{
  e.preventDefault();
  fire();
 },
 {passive:false}
);

document.getElementById("fire").onclick=fire;

/* ---------------- RELOAD ---------------- */

document.getElementById("reload").onclick=()=>{

 ammo=30;
 showNotice("🔄 RELOADED");

};

/* ---------------- WEAPON ---------------- */

document.getElementById("weapon").onclick=()=>{

 weapon=weapon==="RIFLE"?"PISTOL":"RIFLE";

 document.getElementById("weaponText").innerText=weapon;

 showNotice("🔫 "+weapon);

};

/* ---------------- CAR ---------------- */

document.getElementById("car").onclick=()=>{

 inCar=!inCar;

 player.speed=inCar?6:3;

 showNotice(inCar?"🚗 CAR MODE ON":"🚶 CAR MODE OFF");

};

/* ---------------- NOTICE ---------------- */

let noticeTimer;

function showNotice(t){

 let n=document.getElementById("notice");

 n.innerText=t;
 n.style.display="block";

 clearTimeout(noticeTimer);

 noticeTimer=setTimeout(()=>{
  n.style.display="none";
 },1200);

}

/* ---------------- UPDATE ---------------- */

function update(){

 if(!running)return;

 let dx=0;
 let dy=0;

 if(keys.up)dy--;
 if(keys.down)dy++;
 if(keys.left)dx--;
 if(keys.right)dx++;

 if(dx||dy){

  let len=Math.hypot(dx,dy);

  dx/=len;
  dy/=len;

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  player.angle=Math.atan2(dy,dx);
 }

 player.x=Math.max(30,Math.min(WORLD-30,player.x));
 player.y=Math.max(30,Math.min(WORLD-30,player.y));

 /* CAMERA */

 camera.x=player.x-W/2;
 camera.y=player.y-H/2;

 camera.x=Math.max(0,Math.min(WORLD-W,camera.x));
 camera.y=Math.max(0,Math.min(WORLD-H,camera.y));

 /* BULLETS */

 for(let b of bullets){

  b.x+=b.vx;
  b.y+=b.vy;
  b.life--;

 }

 bullets=bullets.filter(b=>b.life>0);

 /* ENEMY AI */

 for(let e of enemies){

  let dx=player.x-e.x;
  let dy=player.y-e.y;
  let d=Math.hypot(dx,dy);

  if(d>50){

   e.x+=(dx/d)*e.speed;
   e.y+=(dy/d)*e.speed;

  }

  if(e.police && d<650){

   e.shoot++;

   if(e.shoot>100){

    e.shoot=0;

    let a=Math.atan2(dy,dx);

    enemyBullets.push({
     x:e.x,
     y:e.y,
     vx:Math.cos(a)*5,
     vy:Math.sin(a)*5,
     life:120
    });

   }
  }

  if(d<43){

   player.hp-=inCar?.08:.18;

  }
 }

 /* ENEMY BULLETS */

 for(let b of enemyBullets){

  b.x+=b.vx;
  b.y+=b.vy;
  b.life--;

  if(Math.hypot(
   b.x-player.x,
   b.y-player.y
  )<player.r+5){

   player.hp-=7;
   b.life=0;

  }

 }

 enemyBullets=enemyBullets.filter(b=>b.life>0);

 /* PLAYER BULLET HIT */

 for(let b of bullets){

  for(let e of enemies){

   if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+7){

    e.hp-=b.damage;
    b.life=0;

    if(e.hp<=0){

     kills++;
     score+=e.police?150:100;
     coins+=e.police?25:10;

     e.dead=true;

    }

    break;
   }
  }
 }

 enemies=enemies.filter(e=>!e.dead);

 while(enemies.length<10 && kills<missionTarget){
  spawnEnemy();
 }

 /* PICKUPS */

 for(let p of pickups){

  if(Math.hypot(
   p.x-player.x,
   p.y-player.y
  )<38){

   if(p.type==="coin"){

    coins+=10;
    showNotice("🪙 +10 COINS");

   }else{

    player.hp=Math.min(100,player.hp+30);
    showNotice("❤️ HEALTH +30");

   }

   p.collected=true;
  }
 }

 pickups=pickups.filter(p=>!p.collected);

 /* MISSIONS */

 if(kills>=missionTarget){

  if(mission<3){

   mission++;
   missionTarget=missionTargets[mission-1];

   document.getElementById("mission").innerHTML=
   "🎯 MISSION "+mission+
   "<br>Defeat <b>"+missionTarget+"</b> enemies";

   showNotice("🎯 NEW MISSION!");

  }else{

   running=false;
   endGame("🏆 ALL MISSIONS COMPLETE!");

  }
 }

 if(player.hp<=0){

  player.hp=0;
  running=false;
  endGame("💀 GAME OVER");

 }

 updateHUD();

}

/* ---------------- DRAW ---------------- */

function draw(){

 ctx.clearRect(0,0,W,H);

 ctx.save();

 ctx.translate(-camera.x,-camera.y);

 /* GRASS */

 ctx.fillStyle="#276238";
 ctx.fillRect(0,0,WORLD,WORLD);

 /* ROADS */

 ctx.fillStyle="#555";

 for(let x=0;x<WORLD;x+=520){
  ctx.fillRect(x,0,120,WORLD);
 }

 for(let y=0;y<WORLD;y+=520){
  ctx.fillRect(0,y,WORLD,120);
 }

 /* ROAD MARKINGS */

 ctx.strokeStyle="#ddd";
 ctx.lineWidth=5;
 ctx.setLineDash([35,35]);

 for(let x=60;x<WORLD;x+=520){

  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,WORLD);
  ctx.stroke();

 }

 for(let y=60;y<WORLD;y+=520){

  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(WORLD,y);
  ctx.stroke();

 }

 ctx.setLineDash([]);

 /* BUILDINGS */

 for(let b of buildings){

  ctx.fillStyle="#414141";
  ctx.fillRect(b.x,b.y,b.w,b.h);

  ctx.strokeStyle="#888";
  ctx.lineWidth=9;
  ctx.strokeRect(b.x,b.y,b.w,b.h);

  ctx.fillStyle="#9ed4ff";

  for(
   let xx=b.x+25;
   xx<b.x+b.w-20;
   xx+=58
  ){

   for(
    let yy=b.y+25;
    yy<b.y+b.h-20;
    yy+=58
   ){

    ctx.fillRect(xx,yy,23,27);

   }
  }
 }

 /* CARS */

 for(let c of cars){

  ctx.save();

  ctx.translate(c.x,c.y);
  ctx.rotate(c.angle);

  ctx.fillStyle=c.color;
  ctx.fillRect(-46,-23,92,46);

  ctx.fillStyle="#111";
  ctx.fillRect(-21,-17,42,34);

  ctx.fillStyle="#222";
  ctx.fillRect(-35,-29,18,8);
  ctx.fillRect(17,-29,18,8);
  ctx.fillRect(-35,21,18,8);
  ctx.fillRect(17,21,18,8);

  ctx.restore();

 }

 /* PICKUPS */

 for(let p of pickups){

  if(p.type==="coin"){

   ctx.fillStyle="#ffd21c";
   ctx.beginPath();
   ctx.arc(p.x,p.y,14,0,Math.PI*2);
   ctx.fill();

   ctx.fillStyle="#6b4b00";
   ctx.font="bold 14px Arial";
   ctx.fillText("$",p.x-4,p.y+5);

  }else{

   ctx.fillStyle="white";
   ctx.fillRect(p.x-16,p.y-16,32,32);

   ctx.fillStyle="red";
   ctx.fillRect(p.x-5,p.y-12,10,24);
   ctx.fillRect(p.x-12,p.y-5,24,10);

  }

 }

 /* ENEMIES */

 for(let e of enemies){

  ctx.fillStyle=e.police?"#2876e8":"#a32bc0";

  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fill();

  /* health bar */

  ctx.fillStyle="#111";
  ctx.fillRect(e.x-26,e.y-35,52,7);

  ctx.fillStyle="#24e05b";
  ctx.fillRect(
   e.x-26,
   e.y-35,
   52*Math.max(0,e.hp/100),
   7
  );

  if(e.police){

   ctx.fillStyle="white";
   ctx.font="bold 12px Arial";
   ctx.fillText("POLICE",e.x-27,e.y+39);

  }

 }

 /* BULLETS */

 ctx.fillStyle="#ffe55c";

 for(let b of bullets){

  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();

 }

 ctx.fillStyle="#ff4444";

 for(let b of enemyBullets){

  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();

 }

 /* PLAYER */

 ctx.save();

 ctx.translate(player.x,player.y);
 ctx.rotate(player.angle);

 ctx.fillStyle=inCar?"#f39c12":"#2196ed";

 ctx.beginPath();
 ctx.arc(
  0,
  0,
  inCar?29:22,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="#111";
 ctx.fillRect(0,-5,35,10);

 ctx.restore();

 ctx.restore();

}

/* ---------------- HUD ---------------- */

function updateHUD(){

 document.getElementById("hp").innerText=Math.ceil(player.hp);
 document.getElementById("ammo").innerText=ammo;
 document.getElementById("score").innerText=score;
 document.getElementById("kills").innerText=kills;
 document.getElementById("coins").innerText=coins;

}

/* ---------------- END ---------------- */

function endGame(title){

 document.getElementById("endTitle").innerText=title;
 document.getElementById("endScore").innerText=score;
 document.getElementById("endCoins").innerText=coins;
 document.getElementById("gameOver").style.display="flex";

}

document.getElementById("restart").onclick=()=>{
 location.reload();
};

/* ---------------- LOOP ---------------- */

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);

}

updateHUD();
loop();

</script>

</body>
</html>
