<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Zone V4</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow:hidden;background:#111;font-family:Arial}
canvas{display:block;background:#286238}

#hud{
 position:fixed;top:15px;left:15px;z-index:5;
 background:rgba(0,0,0,.78);color:white;
 padding:14px 18px;border-radius:18px;
 font-size:18px;line-height:1.65
}
#mission{
 position:fixed;top:15px;right:15px;z-index:5;
 background:rgba(0,0,0,.78);color:white;
 padding:12px 18px;border-radius:18px;
 text-align:center;font-size:18px
}
#carStatus{
 position:fixed;top:120px;right:15px;z-index:5;
 background:rgba(0,0,0,.7);color:white;
 padding:8px 14px;border-radius:12px;
 display:none
}

.controls{
 position:fixed;bottom:25px;left:20px;right:20px;
 z-index:10;height:210px
}
.btn{
 position:absolute;width:92px;height:92px;
 border-radius:50%;border:2px solid rgba(255,255,255,.55);
 background:rgba(255,255,255,.20);
 color:white;font-size:30px;font-weight:bold;
 display:flex;align-items:center;justify-content:center;
 user-select:none
}
.up{left:110px;top:0}
.down{left:110px;bottom:0}
.left{left:0;top:70px}
.right{left:220px;top:70px}

.fire{
 right:0;bottom:20px;width:125px;height:125px;
 background:rgba(210,40,35,.85);font-size:22px
}
.reload{
 right:130px;bottom:75px;width:90px;height:70px;
 font-size:14px
}
.car{
 right:145px;bottom:0;width:100px;height:65px;
 font-size:13px
}
.weapon{
 right:260px;bottom:70px;width:90px;height:65px;
 font-size:13px
}

button{touch-action:none}

#gameOver{
 display:none;position:fixed;inset:0;z-index:20;
 background:rgba(0,0,0,.88);color:white;
 align-items:center;justify-content:center;
 flex-direction:column;text-align:center
}
#gameOver h1{font-size:42px}
#restart{
 padding:15px 30px;border:0;border-radius:12px;
 font-size:20px
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
⭐ Score: <span id="score">0</span><br>
💀 Kills: <span id="kills">0</span><br>
🪙 Coins: <span id="coins">0</span>
</div>

<div id="mission">
🎯 MISSION<br>
Defeat <b>15</b> enemies
</div>

<div id="carStatus">🚗 CAR MODE</div>

<div class="controls">
<button class="btn up" id="up">▲</button>
<button class="btn down" id="down">▼</button>
<button class="btn left" id="left">◀</button>
<button class="btn right" id="right">▶</button>

<button class="btn fire" id="fire">FIRE</button>
<button class="btn reload" id="reload">RELOAD</button>
<button class="btn car" id="car">🚗 CAR</button>
<button class="btn weapon" id="weapon">RIFLE</button>
</div>

<div id="gameOver">
<h1 id="endTitle">GAME OVER</h1>
<h2>Score: <span id="endScore">0</span></h2>
<button id="restart">PLAY AGAIN</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const keys={
 up:false,down:false,left:false,right:false
};

let player={
 x:0,y:0,r:20,hp:100,
 angle:0,speed:3
};

let camera={x:0,y:0};

let ammo=30;
let score=0;
let kills=0;
let coins=0;
let weapon="RIFLE";
let inCar=false;
let gameRunning=true;

let enemies=[];
let bullets=[];
let enemyBullets=[];
let pickups=[];
let buildings=[];
let cars=[];

/* WORLD */

const WORLD=2600;

for(let x=100;x<WORLD;x+=430){
 for(let y=100;y<WORLD;y+=430){
  buildings.push({
   x:x+35+Math.random()*50,
   y:y+35+Math.random()*50,
   w:250+Math.random()*70,
   h:220+Math.random()*70
  });
 }
}

for(let i=0;i<8;i++){
 cars.push({
  x:250+i*300,
  y:350+(i%3)*650,
  w:90,h:45,
  angle:0,
  color:i%2?"#d93636":"#2468d8"
 });
}

function spawnEnemy(){
 let e={
  x:100+Math.random()*(WORLD-200),
  y:100+Math.random()*(WORLD-200),
  r:22,
  hp:100,
  speed:0.7+Math.random()*.5,
  police:Math.random()<.35,
  shoot:0
 };
 enemies.push(e);
}

for(let i=0;i<15;i++)spawnEnemy();

for(let i=0;i<12;i++){
 pickups.push({
  x:100+Math.random()*(WORLD-200),
  y:100+Math.random()*(WORLD-200),
  type:Math.random()<.5?"coin":"health"
 });
}

/* START */

player.x=WORLD/2;
player.y=WORLD/2;

/* INPUT */

function hold(id,key){
 const b=document.getElementById(id);

 b.addEventListener("touchstart",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 b.addEventListener("touchend",e=>{
  e.preventDefault();
  keys[key]=false;
 });

 b.addEventListener("mousedown",()=>keys[key]=true);
 b.addEventListener("mouseup",()=>keys[key]=false);
 b.addEventListener("mouseleave",()=>keys[key]=false);
}

hold("up","up");
hold("down","down");
hold("left","left");
hold("right","right");

/* SHOOT */

document.getElementById("fire").addEventListener("touchstart",e=>{
 e.preventDefault();
 fire();
});
document.getElementById("fire").addEventListener("click",fire);

function fire(){

 if(!gameRunning)return;

 if(ammo<=0){
  return;
 }

 ammo--;

 let a=player.angle;

 bullets.push({
  x:player.x+Math.cos(a)*28,
  y:player.y+Math.sin(a)*28,
  vx:Math.cos(a)*10,
  vy:Math.sin(a)*10,
  life:70,
  damage:weapon==="RIFLE"?45:30
 });
}

/* RELOAD */

document.getElementById("reload").onclick=()=>{
 ammo=30;
};

/* WEAPON */

document.getElementById("weapon").onclick=()=>{
 weapon=weapon==="RIFLE"?"PISTOL":"RIFLE";
 document.getElementById("weapon").innerText=weapon;
};

/* CAR */

document.getElementById("car").onclick=()=>{
 inCar=!inCar;
 document.getElementById("carStatus").style.display=
  inCar?"block":"none";
 player.speed=inCar?6:3;
};

/* UPDATE */

function update(){

 if(!gameRunning)return;

 let dx=0,dy=0;

 if(keys.up)dy-=1;
 if(keys.down)dy+=1;
 if(keys.left)dx-=1;
 if(keys.right)dx+=1;

 if(dx||dy){
  let len=Math.hypot(dx,dy);
  dx/=len;dy/=len;

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  if(dx||dy)player.angle=Math.atan2(dy,dx);
 }

 player.x=Math.max(25,Math.min(WORLD-25,player.x));
 player.y=Math.max(25,Math.min(WORLD-25,player.y));

 /* camera */

 camera.x=player.x-W/2;
 camera.y=player.y-H/2;

 camera.x=Math.max(0,Math.min(WORLD-W,camera.x));
 camera.y=Math.max(0,Math.min(WORLD-H,camera.y));

 /* bullets */

 bullets.forEach(b=>{
  b.x+=b.vx;
  b.y+=b.vy;
  b.life--;
 });

 bullets=bullets.filter(b=>b.life>0);

 /* enemy AI */

 enemies.forEach(e=>{

  let dx=player.x-e.x;
  let dy=player.y-e.y;
  let d=Math.hypot(dx,dy);

  if(d>45){
   e.x+=(dx/d)*e.speed;
   e.y+=(dy/d)*e.speed;
  }

  if(e.police && d<500){
   e.shoot++;

   if(e.shoot>90){
    e.shoot=0;

    let a=Math.atan2(dy,dx);

    enemyBullets.push({
     x:e.x,y:e.y,
     vx:Math.cos(a)*5,
     vy:Math.sin(a)*5,
     life:100
    });
   }
  }

  if(d<40){
   player.hp-=0.15;
  }
 });

 /* enemy bullets */

 enemyBullets.forEach(b=>{
  b.x+=b.vx;
  b.y+=b.vy;
  b.life--;

  if(Math.hypot(b.x-player.x,b.y-player.y)<25){
   player.hp-=8;
   b.life=0;
  }
 });

 enemyBullets=enemyBullets.filter(b=>b.life>0);

 /* bullet hit */

 bullets.forEach(b=>{
  enemies.forEach(e=>{
   if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){
    e.hp-=b.damage;
    b.life=0;

    if(e.hp<=0){
     kills++;
     score+=100;
     coins+=e.police?20:10;

     e.x=-9999;
     e.y=-9999;
    }
   }
  });
 });

 enemies=enemies.filter(e=>e.hp>0);

 while(enemies.length<8 && kills<15)spawnEnemy();

 /* pickups */

 pickups.forEach(p=>{
  if(Math.hypot(p.x-player.x,p.y-player.y)<35){

   if(p.type==="coin"){
    coins+=10;
   }else{
    player.hp=Math.min(100,player.hp+30);
   }

   p.x=-9999;
   p.y=-9999;
  }
 });

 pickups=pickups.filter(p=>p.x>0);

 /* mission */

 if(kills>=15){
  gameRunning=false;
  showEnd("MISSION COMPLETE!");
 }

 if(player.hp<=0){
  player.hp=0;
  gameRunning=false;
  showEnd("GAME OVER");
 }

 updateHUD();
}

/* DRAW */

function draw(){

 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 /* grass */

 ctx.fillStyle="#286238";
 ctx.fillRect(0,0,WORLD,WORLD);

 /* roads */

 ctx.fillStyle="#555";
 for(let x=0;x<WORLD;x+=430){
  ctx.fillRect(x,0,100,WORLD);
 }
 for(let y=0;y<WORLD;y+=430){
  ctx.fillRect(0,y,WORLD,100);
 }

 /* road lines */

 ctx.strokeStyle="#aaa";
 ctx.lineWidth=5;
 ctx.setLineDash([30,30]);

 for(let x=50;x<WORLD;x+=430){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,WORLD);
  ctx.stroke();
 }

 for(let y=50;y<WORLD;y+=430){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(WORLD,y);
  ctx.stroke();
 }

 ctx.setLineDash([]);

 /* buildings */

 buildings.forEach(b=>{
  ctx.fillStyle="#444";
  ctx.fillRect(b.x,b.y,b.w,b.h);

  ctx.strokeStyle="#888";
  ctx.lineWidth=8;
  ctx.strokeRect(b.x,b.y,b.w,b.h);

  ctx.fillStyle="#9bd0ff";

  for(let xx=b.x+25;xx<b.x+b.w-15;xx+=55){
   for(let yy=b.y+25;yy<b.y+b.h-15;yy+=55){
    ctx.fillRect(xx,yy,22,25);
   }
  }
 });

 /* cars */

 cars.forEach(c=>{
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.rotate(c.angle);

  ctx.fillStyle=c.color;
  ctx.fillRect(-45,-22,90,44);

  ctx.fillStyle="#111";
  ctx.fillRect(-20,-17,40,34);

  ctx.fillStyle="#222";
  ctx.fillRect(-35,-28,18,8);
  ctx.fillRect(17,-28,18,8);
  ctx.fillRect(-35,20,18,8);
  ctx.fillRect(17,20,18,8);

  ctx.restore();
 });

 /* pickups */

 pickups.forEach(p=>{
  if(p.type==="coin"){
   ctx.fillStyle="#ffd21c";
   ctx.beginPath();
   ctx.arc(p.x,p.y,13,0,Math.PI*2);
   ctx.fill();
  }else{
   ctx.fillStyle="white";
   ctx.fillRect(p.x-15,p.y-15,30,30);

   ctx.fillStyle="red";
   ctx.fillRect(p.x-5,p.y-11,10,22);
   ctx.fillRect(p.x-11,p.y-5,22,10);
  }
 });

 /* enemies */

 enemies.forEach(e=>{
  ctx.fillStyle=e.police?"#2563eb":"#a529c0";

  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fill();

  /* health */

  ctx.fillStyle="#111";
  ctx.fillRect(e.x-25,e.y-35,50,6);

  ctx.fillStyle="#20e060";
  ctx.fillRect(e.x-25,e.y-35,50*(e.hp/100),6);

  if(e.police){
   ctx.fillStyle="white";
   ctx.font="14px Arial";
   ctx.fillText("POLICE",e.x-28,e.y+40);
  }
 });

 /* bullets */

 ctx.fillStyle="#ffe45c";

 bullets.forEach(b=>{
  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();
 });

 ctx.fillStyle="#ff5555";

 enemyBullets.forEach(b=>{
  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();
 });

 /* player */

 ctx.save();
 ctx.translate(player.x,player.y);
 ctx.rotate(player.angle);

 ctx.fillStyle=inCar?"#f39c12":"#2495ed";

 ctx.beginPath();
 ctx.arc(0,0,inCar?28:22,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";
 ctx.fillRect(0,-5,35,10);

 ctx.restore();

 ctx.restore();

}

/* HUD */

function updateHUD(){
 document.getElementById("hp").innerText=Math.ceil(player.hp);
 document.getElementById("ammo").innerText=ammo;
 document.getElementById("score").innerText=score;
 document.getElementById("kills").innerText=kills;
 document.getElementById("coins").innerText=coins;
}

/* END */

function showEnd(title){
 document.getElementById("endTitle").innerText=title;
 document.getElementById("endScore").innerText=score;
 document.getElementById("gameOver").style.display="flex";
}

document.getElementById("restart").onclick=()=>{
 location.reload();
};

/* GAME LOOP */

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>

</body>
</html>
