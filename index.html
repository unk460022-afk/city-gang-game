<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Zone 3D FINAL</title>

<style>
html,body{
  margin:0;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game{
  position:fixed;
  inset:0;
}
#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.72);
  padding:12px 16px;
  border-radius:16px;
  font-size:17px;
  line-height:1.65;
}
#mission{
  position:fixed;
  top:15px;
  right:15px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.72);
  padding:12px 15px;
  border-radius:16px;
  text-align:center;
}
#controls{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  z-index:20;
}
.btn{
  position:absolute;
  width:75px;
  height:75px;
  border:2px solid rgba(255,255,255,.55);
  border-radius:50%;
  background:rgba(30,30,30,.65);
  color:white;
  font-size:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}
#up{left:90px;bottom:155px}
#left{left:15px;bottom:75px}
#down{left:90px;bottom:75px}
#right{left:165px;bottom:75px}

#fire{
  right:18px;
  bottom:25px;
  width:105px;
  height:105px;
  background:rgba(210,30,30,.85);
  font-size:25px;
}
#reload{
  right:145px;
  bottom:125px;
  width:80px;
  height:55px;
  border-radius:25px;
  font-size:14px;
}
#weapon{
  right:145px;
  bottom:55px;
  width:80px;
  height:55px;
  border-radius:25px;
  font-size:13px;
}
#gameover{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.8);
  color:white;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}
#gameover h1{
  font-size:45px;
}
#restart{
  padding:15px 30px;
  border:0;
  border-radius:12px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
❤️ HP: <span id="hp">100</span><br>
🔫 Ammo: <span id="ammo">30</span><br>
⭐ Score: <span id="score">0</span><br>
💀 Kills: <span id="kills">0</span><br>
🪙 Coins: <span id="coins">0</span><br>
🔫 Weapon: <span id="weaponText">RIFLE</span>
</div>

<div id="mission">
🎯 MISSION 1<br>
Defeat <b>10</b> enemies<br>
<span id="missionProgress">0 / 10</span>
</div>

<div id="controls">
  <div class="btn" id="up">▲</div>
  <div class="btn" id="left">◀</div>
  <div class="btn" id="down">▼</div>
  <div class="btn" id="right">▶</div>

  <div class="btn" id="reload">RELOAD</div>
  <div class="btn" id="weapon">🔫 WEAPON</div>
  <div class="btn" id="fire">FIRE</div>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p id="finalScore"></p>
  <button id="restart">RESTART</button>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

/* ---------------- SCENE ---------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x78aee8);
scene.fog = new THREE.Fog(0x78aee8,70,180);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  300
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById("game").appendChild(renderer.domElement);

/* ---------------- LIGHT ---------------- */

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,30);
scene.add(sun);

/* ---------------- GROUND ---------------- */

const ground = new THREE.Mesh(
  new THREE.BoxGeometry(180,.5,180),
  new THREE.MeshStandardMaterial({color:0x28733b})
);

ground.position.y=-.25;
scene.add(ground);

/* ---------------- ROADS ---------------- */

function road(x,z,w,d){

  const r = new THREE.Mesh(
    new THREE.BoxGeometry(w,.08,d),
    new THREE.MeshStandardMaterial({color:0x444444})
  );

  r.position.set(x,0,z);
  scene.add(r);

}

road(0,0,18,180);
road(0,0,180,18);

/* road lines */

function line(x,z,w,d){

  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,.12,d),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );

  m.position.set(x,.08,z);
  scene.add(m);
}

for(let z=-85;z<=85;z+=10)
  line(0,z,.35,5);

for(let x=-85;x<=85;x+=10)
  line(x,0,5,.35);

/* ---------------- BUILDINGS ---------------- */

function building(x,z,w,d,h){

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(
        Math.random(),
        .15,
        .25+.15*Math.random()
      )
    })
  );

  body.position.set(x,h/2,z);
  scene.add(body);

  for(let y=3;y<h;y+=3){

    for(let xx=-w/2+1;xx<w/2;xx+=3){

      const win = new THREE.Mesh(
        new THREE.BoxGeometry(.8,.9,.08),
        new THREE.MeshStandardMaterial({
          color:0x70c8ee,
          emissive:0x173b55
        })
      );

      win.position.set(x+xx,y,z-d/2-.05);
      scene.add(win);

    }

  }
}

/* city blocks */

for(let x=-75;x<=75;x+=25){

  for(let z=-75;z<=75;z+=25){

    if(Math.abs(x)<15 || Math.abs(z)<15) continue;

    building(
      x,
      z,
      16,
      16,
      8+Math.random()*14
    );

  }
}

/* ---------------- PLAYER ---------------- */

const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(.8,1.2,4,8),
  new THREE.MeshStandardMaterial({color:0x168fe0})
);

body.position.y=1.3;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(.55,16,16),
  new THREE.MeshStandardMaterial({color:0xf0bd91})
);

head.position.y=2.7;
player.add(head);

scene.add(player);

player.position.set(0,0,8);

/* gun */

const gun = new THREE.Mesh(
  new THREE.BoxGeometry(.25,.25,1.4),
  new THREE.MeshStandardMaterial({color:0x151515})
);

gun.position.set(.65,1.6,-.8);
player.add(gun);

/* ---------------- ENEMIES ---------------- */

let enemies=[];

function spawnEnemy(){

  const e = new THREE.Group();

  const b = new THREE.Mesh(
    new THREE.CapsuleGeometry(.7,1,4,8),
    new THREE.MeshStandardMaterial({color:0xa526d2})
  );

  b.position.y=1.1;
  e.add(b);

  const h = new THREE.Mesh(
    new THREE.SphereGeometry(.5,12,12),
    new THREE.MeshStandardMaterial({color:0xd7a37e})
  );

  h.position.y=2.4;
  e.add(h);

  e.position.set(
    (Math.random()-.5)*140,
    0,
    (Math.random()-.5)*140
  );

  scene.add(e);

  enemies.push({
    mesh:e,
    hp:3,
    cooldown:Math.random()*2
  });
}

for(let i=0;i<12;i++) spawnEnemy();

/* ---------------- BULLETS ---------------- */

let bullets=[];

function shoot(){

  if(gameOver) return;

  if(ammo<=0){
    reload();
    return;
  }

  ammo--;

  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(.13,8,8),
    new THREE.MeshBasicMaterial({color:0xffff00})
  );

  bullet.position.copy(player.position);
  bullet.position.y=1.5;

  const dir = new THREE.Vector3(0,0,-1);
  dir.applyQuaternion(player.quaternion);
  dir.normalize();

  scene.add(bullet);

  bullets.push({
    mesh:bullet,
    dir:dir,
    life:80
  });

  updateHUD();
}

/* ---------------- WEAPONS ---------------- */

const weapons=[
  {name:"RIFLE",damage:1},
  {name:"SHOTGUN",damage:2},
  {name:"PISTOL",damage:1}
];

let weaponIndex=0;

function changeWeapon(){

  weaponIndex=(weaponIndex+1)%weapons.length;
  document.getElementById("weaponText").textContent=
    weapons[weaponIndex].name;
}

/* ---------------- GAME VARIABLES ---------------- */

let hp=100;
let ammo=30;
let score=0;
let kills=0;
let coins=0;
let gameOver=false;

function updateHUD(){

  document.getElementById("hp").textContent=hp;
  document.getElementById("ammo").textContent=ammo;
  document.getElementById("score").textContent=score;
  document.getElementById("kills").textContent=kills;
  document.getElementById("coins").textContent=coins;
  document.getElementById("missionProgress").textContent=
    Math.min(kills,10)+" / 10";

  if(kills>=10){
    document.getElementById("mission").innerHTML=
      "🏆 MISSION COMPLETE!<br>10 ENEMIES DEFEATED";
  }
}

/* ---------------- RELOAD ---------------- */

function reload(){

  if(gameOver) return;

  ammo=30;
  updateHUD();
}

/* ---------------- DAMAGE ---------------- */

function damagePlayer(){

  hp-=5;

  if(hp<=0){

    hp=0;
    gameOver=true;

    document.getElementById("gameover").style.display="flex";

    document.getElementById("finalScore").textContent=
      "Score: "+score+" | Kills: "+kills;

  }

  updateHUD();
}

/* ---------------- CONTROLS ---------------- */

let keys={
  up:false,
  down:false,
  left:false,
  right:false
};

function control(id,key){

  const el=document.getElementById(id);

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  el.addEventListener("pointerup",e=>{
    e.preventDefault();
    keys[key]=false;
  });

  el.addEventListener("pointercancel",()=>{
    keys[key]=false;
  });

  el.addEventListener("pointerleave",()=>{
    keys[key]=false;
  });
}

control("up","up");
control("down","down");
control("left","left");
control("right","right");

document.getElementById("fire")
.addEventListener("pointerdown",shoot);

document.getElementById("reload")
.addEventListener("pointerdown",reload);

document.getElementById("weapon")
.addEventListener("pointerdown",changeWeapon);

/* keyboard */

addEventListener("keydown",e=>{

  if(e.key==="w") keys.up=true;
  if(e.key==="s") keys.down=true;
  if(e.key==="a") keys.left=true;
  if(e.key==="d") keys.right=true;

  if(e.code==="Space") shoot();
  if(e.key==="r") reload();

});

addEventListener("keyup",e=>{

  if(e.key==="w") keys.up=false;
  if(e.key==="s") keys.down=false;
  if(e.key==="a") keys.left=false;
  if(e.key==="d") keys.right=false;

});

/* ---------------- RESTART ---------------- */

document.getElementById("restart")
.addEventListener("click",()=>{
  location.reload();
});

/* ---------------- CAMERA ---------------- */

function cameraFollow(){

  const offset=new THREE.Vector3(0,7,10);

  offset.applyQuaternion(player.quaternion);

  const target=player.position.clone().add(offset);

  camera.position.lerp(target,.12);

  camera.lookAt(
    player.position.x,
    player.position.y+1,
    player.position.z
  );
}

/* ---------------- PLAYER MOVEMENT ---------------- */

function movePlayer(){

  if(gameOver) return;

  const speed=.18;

  if(keys.left)
    player.rotation.y += .045;

  if(keys.right)
    player.rotation.y -= .045;

  const direction=new THREE.Vector3();

  if(keys.up) direction.z-=speed;
  if(keys.down) direction.z+=speed;

  direction.applyQuaternion(player.quaternion);

  player.position.add(direction);

  player.position.x=Math.max(-85,Math.min(85,player.position.x));
  player.position.z=Math.max(-85,Math.min(85,player.position.z));
}

/* ---------------- ENEMY AI ---------------- */

function enemyAI(dt){

  enemies.forEach((enemy,i)=>{

    if(enemy.hp<=0) return;

    const e=enemy.mesh;

    const dx=player.position.x-e.position.x;
    const dz=player.position.z-e.position.z;

    const distance=Math.sqrt(dx*dx+dz*dz);

    if(distance<35){

      e.lookAt(
        player.position.x,
        e.position.y,
        player.position.z
      );

      if(distance>5){

        const speed=.025;

        e.position.x+=(dx/distance)*speed;
        e.position.z+=(dz/distance)*speed;

      }else{

        enemy.cooldown-=dt;

        if(enemy.cooldown<=0){

          damagePlayer();
          enemy.cooldown=1.2;

        }

      }

    }

  });
}

/* ---------------- BULLET UPDATE ---------------- */

function updateBullets(){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.mesh.position.addScaledVector(b.dir,.8);
    b.life--;

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){

      const e=enemies[j];

      if(e.hp<=0) continue;

      const dist=b.mesh.position.distanceTo(e.mesh.position);

      if(dist<1.5){

        e.hp-=weapons[weaponIndex].damage;
        hit=true;

        if(e.hp<=0){

          scene.remove(e.mesh);

          kills++;
          score+=100;
          coins+=10;

          enemies.splice(j,1);

          setTimeout(spawnEnemy,1000);

          updateHUD();
        }

        break;
      }

    }

    if(hit || b.life<=0){

      scene.remove(b.mesh);
      bullets.splice(i,1);

    }

  }
}

/* ---------------- LOOP ---------------- */

let last=performance.now();

function animate(now){

  requestAnimationFrame(animate);

  const dt=(now-last)/1000;
  last=now;

  movePlayer();
  enemyAI(dt);
  updateBullets();
  cameraFollow();

  renderer.render(scene,camera);
}

animate(performance.now());

/* ---------------- RESIZE ---------------- */

addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

});

updateHUD();

</script>
</body>
</html>
